<div class="g2-accounts-dashboard">
	<!-- Speedometer KPI Metric Grid -->
	<div class="dashboard-kpi-grid">
		<!-- 1. Total Outgoing Bills in DH -->
		<div class="kpi-card speedometer-card outgoing-bills" id="card-outgoing-bills">
			<div class="kpi-card-header">
				<span class="kpi-title">TOTAL OUTGOING BILLS</span>
				<span class="kpi-badge outgoing">Outgoing</span>
			</div>

			<!-- Speedometer Gauge -->
			<div class="speedometer-container">
				<svg class="speedometer-svg" viewBox="0 0 200 120">
					<defs>
						<linearGradient id="grad-outgoing-bills" x1="0%" y1="0%" x2="100%" y2="0%">
							<stop offset="0%" stop-color="#f59e0b" />
							<stop offset="100%" stop-color="#ef4444" />
						</linearGradient>
					</defs>
					<!-- Background Track Arc -->
					<path class="gauge-bg-arc" d="M 25 100 A 75 75 0 0 1 175 100" />
					<!-- Active Value Arc -->
					<path class="gauge-val-arc arc-outgoing-bills" d="M 25 100 A 75 75 0 0 1 175 100" stroke="url(#grad-outgoing-bills)" />
					<!-- Tick Marks -->
					<line x1="25" y1="100" x2="33" y2="100" class="gauge-tick" />
					<line x1="47" y1="47" x2="53" y2="53" class="gauge-tick" />
					<line x1="100" y1="25" x2="100" y2="33" class="gauge-tick" />
					<line x1="153" y1="47" x2="147" y2="53" class="gauge-tick" />
					<line x1="175" y1="100" x2="167" y2="100" class="gauge-tick" />
					<!-- Needle -->
					<g class="gauge-needle-group needle-outgoing-bills" style="transform: rotate(-90deg);">
						<polygon points="97,100 100,28 103,100 100,105" class="gauge-needle needle-orange" />
						<circle cx="100" cy="100" r="7" class="gauge-pivot-outer" />
						<circle cx="100" cy="100" r="3.5" class="gauge-pivot-inner" />
					</g>
				</svg>
				<div class="gauge-scale-labels">
					<span class="scale-min">0 DH</span>
					<span class="scale-max" id="max-outgoing-bills">100K DH</span>
				</div>
			</div>

			<div class="kpi-card-body">
				<div class="kpi-value-wrapper">
					<span class="kpi-value" id="kpi-outgoing-bills-val">0.00</span>
					<span class="kpi-currency">DH</span>
				</div>
			</div>
			<div class="kpi-card-footer">
				<span class="kpi-subtext">Total bills payable</span>
			</div>
		</div>

		<!-- 2. Total Incoming Bills in DH -->
		<div class="kpi-card speedometer-card incoming-bills" id="card-incoming-bills">
			<div class="kpi-card-header">

					<line x1="25" y1="100" x2="33" y2="100" class="gauge-tick" />
					<line x1="47" y1="47" x2="53" y2="53" class="gauge-tick" />
					<line x1="100" y1="25" x2="100" y2="33" class="gauge-tick" />
					<line x1="153" y1="47" x2="147" y2="53" class="gauge-tick" />
					<line x1="175" y1="100" x2="167" y2="100" class="gauge-tick" />
					<g class="gauge-needle-group needle-incoming-bills" style="transform: rotate(-90deg);">
						<polygon points="97,100 100,28 103,100 100,105" class="gauge-needle needle-emerald" />
						<circle cx="100" cy="100" r="7" class="gauge-pivot-outer" />
						<circle cx="100" cy="100" r="3.5" class="gauge-pivot-inner" />
					</g>

				<div class="gauge-scale-labels">

					<line x1="153" y1="47" x2="147" y2="53" class="gauge-tick" />
